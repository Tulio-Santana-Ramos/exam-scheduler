services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam_scheduler
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam_scheduler"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://exam:exam@db:5432/exam_scheduler
      # Local-only secret; real deployments must set their own (openssl rand -hex 32).
      JWT_SECRET: local-development-secret-change-me-0123456789
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: debug
      LOG_FORMAT: pretty
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_SHOW_DEMO_ACCOUNTS: "true"
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db-data:
